server {
    listen 80;

    root /usr/share/nginx/html;

    # ── Compression ──
    # The Gematria data files are large JSON; without this they go over the
    # wire uncompressed. JSON of this shape compresses ~10x.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # 1. Root App Handling
    location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Static File Handling
    # If the browser asks for a JS/CSS file and it's missing, return 404
    # (Do NOT return index.html)
    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 3. Gematria data — content-addressed by the build, safe to cache hard.
    location /gematria-data/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 4. Any other JSON payload (torah_text.json etc.)
    location ~* \.json$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # 5. index.html must never be cached, so deploys take effect immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 6. Service worker.
    # Browsers decide whether a new deploy has arrived by fetching this file
    # and comparing bytes. If a cache answered instead, they would keep
    # seeing the old one and the "new version" notice would never appear.
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The offline page is fetched by the service worker on install, with the
    # HTTP cache bypassed — but browsers may also load it directly.
    location = /offline.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 7. MapLibre's worker.
    # nginx's mime.types has no entry for .mjs, so it would be served as
    # application/octet-stream and a module Worker refuses to execute that —
    # which leaves the lab map blank.
    #
    # This is deliberately a location and not a `types` block. A `types` block
    # REPLACES the entire inherited MIME map for its context rather than adding
    # to it, so declaring one here made .mjs the only type nginx knew: every
    # other file, index.html included, fell back to default_type
    # (application/octet-stream) and the browser offered to download the site
    # instead of rendering it. `default_type` inside a location only fills in
    # the gap, and leaves mime.types alone.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
