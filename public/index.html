<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Site-wide default icon: the ML monogram. Pages that have their own
         (Gematria, the eruv maps, EMEL, CertMonitor) still swap theirs in at
         runtime. The .ico is for anything that asks for /favicon.ico by name
         or can't read SVG; browsers that can will take the crisp SVG. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />

    <!-- Primary meta -->
    <title>Mark Lebrett | Portal</title>
    <meta name="description" content="Mark Lebrett - founder of EMEL Solutions, a UK technology consultancy" />
    <meta name="author" content="Mark Lebrett" />

    <!-- Open Graph (Facebook, WhatsApp, iMessage, Slack, LinkedIn) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://marklebrett.co.uk/" />
    <meta property="og:title"       content="Mark Lebrett | Portal" />
    <meta property="og:description" content="Mark Lebrett - founder of EMEL Solutions, a UK technology consultancy" />
    <meta property="og:site_name"   content="Mark Lebrett" />
    <!-- 1200×630 is the size every major platform crops previews to; the old
         256px square was letterboxed or cut down, and the file was corrupt. -->
    <meta property="og:image"        content="https://marklebrett.co.uk/og-image.png" />
    <meta property="og:image:type"   content="image/png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="The ML monogram above the name Mark Lebrett" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Mark Lebrett | Portal" />
    <meta name="twitter:description" content="Mark Lebrett - founder of EMEL Solutions, a UK technology consultancy" />
    <meta name="twitter:image"       content="https://marklebrett.co.uk/og-image.png" />
    <meta name="twitter:image:alt"   content="The ML monogram above the name Mark Lebrett" />

    <!-- Full-bleed square: iOS applies its own rounded mask. -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- iOS reads the manifest for most things, but takes the home-screen
         label from here; without it, it uses the full <title>. -->
    <meta name="apple-mobile-web-app-title" content="Mark Lebrett" />

    <!-- Google Analytics (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TEL1PZV881"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TEL1PZV881');
    </script>

    <!-- Microsoft Clarity -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "vuuxfucgoa");
    </script>

  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

</html>
