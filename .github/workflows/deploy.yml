name: Deploy to DigitalOcean

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            cd /home/marklebrett/n8n-docker-caddy/gematria-app

            # Ensure remote points to new repo name (safe to re-run)
            git remote set-url origin https://github.com/Moley123/MarkLebrett-PersonalSite.git

            # 1. Make sure the stack is up before pruning.
            # `docker image prune -a` spares images that some container is
            # using, and nothing else. If a previous deploy left the stack
            # down, pruning here would delete the locally built app image —
            # the very one step 5 rolls back to. This is a no-op when the
            # containers are already running.
            echo "Ensuring containers are up before pruning..."
            docker compose up -d

            # 2. Reclaim disk BEFORE building.
            # The build writes its temporary files to the droplet's disk, and
            # a full disk fails the build with ENOSPC rather than anything
            # that points at the code. Old build cache and superseded images
            # from previous deploys are what fill it up.
            # This runs while the containers are still up, so the images they
            # are using are protected from the prune — including the one we
            # roll back to in step 6 if the build fails.
            # Clearing the whole build cache costs a cold `npm install` (~3
            # min). That is a deliberate trade: the cache only ever helps when
            # package.json is unchanged, and a deploy that runs out of disk
            # costs far more than three minutes.
            echo "Disk before cleanup:"
            df -h /
            docker builder prune -af
            docker image prune -af
            echo "Disk after cleanup:"
            df -h /

            # 3. Stop containers to free up RAM for the build
            echo "Stopping containers to free memory..."
            docker compose down

            # 4. Update Code
            git reset --hard
            git pull origin main

            # 5. Regenerate Data
            # The Gematria dataset (public/gematria-data/) is committed, so it
            # is NOT rebuilt here — that keeps deploys off Sefaria's API and
            # makes them reproducible. Rebuild it deliberately with:
            #   python3 backend_tools/build_gematria_data.py
            echo "Building Race Data..."
            python3 backend_tools/build_race_data.py

            # 6. Build the new image.
            # Separated from `up` so that a build failure does not leave the
            # site down: the previous image is still on disk, so we can put it
            # straight back and then fail the job loudly.
            echo "Building App..."
            if ! docker compose build; then
              echo "Build FAILED — restoring the previous image so the site stays up"
              docker compose up -d
              df -h /
              exit 1
            fi

            # 7. Start the new image
            echo "Starting App..."
            docker compose up -d

            echo "Deployment Complete! 🚀"