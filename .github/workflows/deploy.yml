name: Deploy to DigitalOcean

# The droplet is a 1 vCPU / 957 MB box. The React build peaks at about 2.3 GB
# of RSS, so building there meant leaning on swap and, once maplibre-gl was
# added, being killed by the OOM killer outright. It also meant a full `npm
# install` and a 15-minute deploy every time, and enough Docker build cache to
# fill the disk.
#
# So the image is built here instead — on a 4 vCPU / 16 GB runner — pushed to
# GHCR, and the droplet only pulls it. That retires the memory problem and the
# disk problem together, and the droplet no longer needs Node at all.

on:
  push:
    branches: [ main ]

env:
  IMAGE: ghcr.io/moley123/marklebrett-personalsite

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build race data
        # Fetches the Torah text from Sefaria and writes src/data/race_data.json,
        # which the React build imports. This used to run on the droplet; it
        # runs here now, before the image is built, so the result is baked in.
        run: |
          python -m pip install --quiet requests
          python backend_tools/build_race_data.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Layer cache lives with the Action, not on the droplet, so an
          # unchanged package-lock.json skips the three-minute npm install.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull and restart on the droplet
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            # Compose finds /home/marklebrett/n8n-docker-caddy/docker-compose.yml
            # by walking up from here, which is also what names the containers
            # n8n-docker-caddy-*.
            cd /home/marklebrett/n8n-docker-caddy/gematria-app

            # Keep the droplet's copy of the source in step for debugging. The
            # build no longer reads it — the image arrives prebuilt.
            git remote set-url origin https://github.com/Moley123/MarkLebrett-PersonalSite.git
            git reset --hard
            git pull origin main

            echo "Disk before:"
            df -h /

            # Only the gematria service is touched, and only after the new
            # image is on disk — caddy and n8n are never stopped, and there is
            # no window where the site is down. If the pull fails, `set -e`
            # stops here with the old container still serving.
            echo "Pulling the new image..."
            docker compose pull gematria

            echo "Restarting the app..."
            docker compose up -d gematria

            # Dangling layers only: this cannot touch an image a container is
            # using, so the previous release stays available to roll back to.
            docker image prune -f

            echo "Disk after:"
            df -h /

            docker compose ps
            echo "Deployment Complete! 🚀"
